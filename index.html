function enviarPedidoOnline(){
  const itens=olItens();if(!itens.length){toast('Escolha ao menos um produto','err');return;}
  const g=id=>(document.getElementById(id)||{}).value||'';
  const nome=g('ol_nome').trim(),fone=g('ol_fone').replace(/\D/g,''),cep=g('ol_cep'),end=g('ol_end'),num=g('ol_num'),bairro=g('ol_bairro'),ref=g('ol_ref'),troco=g('ol_troco'),obs=g('ol_obs');
  if(!nome||!fone){toast('Informe nome e WhatsApp','err');return;}
  const total=olTotal();const cov=coberturaCliente({bairro,lat:null,lng:null});
  const endereco=`${end}, ${num}${bairro?' - '+bairro:''}`;
  // monta mensagem para o WhatsApp do depósito (funciona entre aparelhos)
  const linhas=['*NOVO PEDIDO ONLINE* 🔔','',`*Cliente:* ${nome}`,`*WhatsApp:* ${fone}`,`*Endereço:* ${endereco}`];
  if(ref)linhas.push(`*Referência:* ${ref}`);
  linhas.push('',...itens.map(i=>`• ${i.qtd}x ${i.nome} — ${money(i.qtd*i.unit)}`),'',`*Total:* ${money(total)}`,`*Pagamento:* ${OL_PAY}${OL_PAY==='Dinheiro'&&troco?` (troco p/ ${troco})`:''}`);
  if(obs)linhas.push(`*Obs:* ${obs}`);
  if(cov.k==='nao')linhas.push('','⚠️ *Endereço fora da área cadastrada — requer confirmação*');
  const msg=linhas.join('\n');
  // injeta no ERP local (funciona no mesmo aparelho / balcão); em outro aparelho, o WhatsApp é o canal
  try{
    let c=DB.clientes.find(x=>(x.whatsapp||'').replace(/\D/g,'')===fone||(x.telefone||'').replace(/\D/g,'')===fone);
    if(!c){c={id:uid(),nome,telefone:fone,whatsapp:fone,cep,endereco:end,numero:num,bairro,cidade:g('ol_cidade'),referencia:ref,lat:null,lng:null,origem:'Pedido online',cpf:'',nascimento:'',estado:'',obs:'',dataCadastro:today()};DB.clientes.push(c);}
    const numero=(DB.vendas.reduce((m,v)=>Math.max(m,v.numero||1000),1000))+1;
    DB.vendas.push({id:uid(),numero,clienteId:c.id,itens,subtotal:total,desconto:0,taxaEntrega:(cov.area&&cov.area.taxa)||0,total:total+((cov.area&&cov.area.taxa)||0),pagamentos:[{forma:OL_PAY,valor:total}],recebimentos:[],vencimento:'',status:'Pedido recebido',entregador:'',entregadorId:null,token:null,coordEntregador:null,timeline:[{status:'Pedido recebido',ts:today()+'T'+nowTime()}],data:today(),hora:nowTime(),endereco,telefone:fone,obs:obs+(troco?` | Troco p/ ${troco}`:''),origem:'Pedido online',novo:true,foraArea:cov.k==='nao'});
    save();
  }catch(e){}
  window.open(waLink(waPedidos(),msg),'_blank');
  const host=document.getElementById('pedirView');
  if(host)host.innerHTML=`<div style="max-width:520px;margin:0 auto;padding:40px 20px;text-align:center"><div style="font-size:52px">✅</div><h2 style="margin:14px 0">Pedido enviado!</h2><p style="color:#5b6b8c;font-size:14px;line-height:1.6">Seu pedido foi encaminhado para o nosso WhatsApp. Já vamos confirmar e preparar tudo. Obrigado! 💙</p><button onclick="OL_CART={};OL_CLIENT=null;renderPedir()" style="margin-top:20px;padding:12px 20px;border-radius:10px;background:#12307f;color:#fff;font-weight:700">Fazer outro pedido</button></div>`;
  OL_CART={};
}

/* ========== INTELIGÊNCIA DO CLIENTE ========== */
const RADAR_CFG_DEFAULT={atencao:20,recuperar:30,inativo:60};
function radarCfg(){return DB.config.radar||RADAR_CFG_DEFAULT;}
function statusCliente(cliId){const d=diasSem(cliId);const cfg=radarCfg();if(d===Infinity)return{k:'novo',cor:'#64748b',bg:'#eef1f8',label:'Sem compras'};if(d>=cfg.inativo)return{k:'inativo',cor:'#334155',bg:'#e2e8f0',label:'Inativo'};if(d>=cfg.recuperar)return{k:'recuperar',cor:'#e01e26',bg:'#fdeaea',label:'Recuperar'};if(d>=cfg.atencao)return{k:'atencao',cor:'#e08a00',bg:'#fdf1de',label:'Atenção'};return{k:'ativo',cor:'#12a150',bg:'#e6f6ed',label:'Ativo'};}
function comprasCliente(cliId){return DB.vendas.filter(v=>v.clienteId===cliId&&v.status!=='Cancelado').sort((a,b)=>a.data.localeCompare(b.data));}
function primeiraCompra(cliId){const vs=comprasCliente(cliId);return vs.length?vs[0].data:null;}
function intervaloMedioDias(cliId){const vs=comprasCliente(cliId);if(vs.length<2)return null;let g=0,n=0;for(let i=1;i<vs.length;i++){g+=daysBetween(vs[i-1].data,vs[i].data);n++;}return n?Math.round(g/n):null;}
function previsaoRecompra(cliId){const u=ultimaCompra(cliId);const iv=intervaloMedioDias(cliId);if(!u||!iv)return null;const d=new Date(u);d.setDate(d.getDate()+iv);return d.toISOString().slice(0,10);}
function produtoMaisComprado(cliId){const pv={};comprasCliente(cliId).forEach(v=>v.itens.forEach(i=>pv[i.nome]=(pv[i.nome]||0)+i.qtd));const e=Object.entries(pv).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null;}
function formaMaisUsada(cliId){const fp={};comprasCliente(cliId).forEach(v=>(v.pagamentos||[]).forEach(p=>fp[p.forma]=(fp[p.forma]||0)+1));const e=Object.entries(fp).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null;}
function ticketMedioCliente(cliId){const vs=comprasCliente(cliId);return vs.length?vs.reduce((s,v)=>s+v.total,0)/vs.length:0;}
function aniversariantesHoje(){const t=today().slice(5);return DB.clientes.filter(c=>c.nascimento&&c.nascimento.slice(5)===t);}
function proximosAniversarios(dias){const now=new Date(today());now.setHours(0,0,0,0);const out=[];DB.clientes.forEach(c=>{if(!c.nascimento)return;const p=c.nascimento.split('-');if(p.length<3)return;let nb=new Date(now.getFullYear(),+p[1]-1,+p[2]);if(nb<now)nb=new Date(now.getFullYear()+1,+p[1]-1,+p[2]);const diff=Math.round((nb-now)/864e5);if(diff>=0&&diff<=dias)out.push({c,diff});});return out.sort((a,b)=>a.diff-b.diff);}
function repetirPedido(cliId){const vs=comprasCliente(cliId);if(!vs.length){toast('Cliente sem compras anteriores','err');return;}const last=vs[vs.length-1];CART=last.itens.map(i=>({produtoId:i.produtoId,nome:i.nome,unit:(prodById(i.produtoId)?.preco)||i.unit,qtd:i.qtd}));PDV_CLIENT=cliId;PDV_PAY='Dinheiro';PDV_DESC=0;PDV_TAXA=0;closeModal();go('vendas');toast('Último pedido carregado no PDV','ok');}
function lembreteWa(c){const msg=`Olá, ${c.nome}! 😊 Já faz um tempinho desde sua última compra com a gente. Está precisando de gás? 🔥🛵 É só chamar que entregamos pra você!`;return waLink(c.whatsapp,msg);}

/* ========== RADAR DE CLIENTES ========== */
RENDER.radar=function(){
  const cfg=radarCfg();
  const buckets={ativo:[],atencao:[],recuperar:[],inativo:[],novo:[]};
  DB.clientes.forEach(c=>{buckets[statusCliente(c.id).k].push(c);});
  const recompra=DB.clientes.map(c=>({c,prev:previsaoRecompra(c.id),iv:intervaloMedioDias(c.id),prod:produtoMaisComprado(c.id),u:ultimaCompra(c.id)})).filter(x=>x.prev).map(x=>({...x,dias:daysBetween(today(),x.prev)*(x.prev<today()?-1:1)}));
  const proximos=recompra.filter(x=>x.prev>=today()&&daysBetween(today(),x.prev)<=7).sort((a,b)=>a.prev.localeCompare(b.prev));
  const atrasados=recompra.filter(x=>x.prev<today()).sort((a,b)=>a.prev.localeCompare(b.prev));
  const card=(k,label,emoji,cor)=>{const arr=buckets[k];return`<div class="region-card"><div class="rc-h"><span class="dotc" style="background:${cor}"></span><b style="flex:1">${emoji} ${label}</b><span class="tag" style="background:${cor}22;color:${cor}">${arr.length}</span></div>${arr.slice(0,10).map(c=>cliRow(c)).join('')||'<p style="font-size:12px;color:var(--muted)">Nenhum.</p>'}${arr.length>10?`<div style="font-size:11px;color:var(--muted);margin-top:6px">+${arr.length-10} outros</div>`:''}</div>`;};
  $('#content').innerHTML=`
   <div class="toolbar"><div style="flex:1"><b style="font-size:14px">Radar de Clientes</b><div style="font-size:12px;color:var(--muted)">Classificação automática pela última compra · Atenção ${cfg.atencao}d · Recuperar ${cfg.recuperar}d · Inativo ${cfg.inativo}d</div></div><button class="btn btn-ghost btn-sm" onclick="cfgRadar()">${ic('gear')} Ajustar prazos</button></div>
   <div class="kpis">
     <div class="kpi"><div class="ic green">${ic('check')}</div><div class="lbl">🟢 Ativos</div><div class="val">${buckets.ativo.length}</div></div>
     <div class="kpi"><div class="ic amber">${ic('clock')}</div><div class="lbl">🟡 Atenção (${cfg.atencao}–${cfg.recuperar-1}d)</div><div class="val">${buckets.atencao.length}</div></div>
     <div class="kpi"><div class="ic red">${ic('alert')}</div><div class="lbl">🔴 Recuperar (${cfg.recuperar}d+)</div><div class="val">${buckets.recuperar.length}</div></div>
     <div class="kpi"><div class="ic navy">${ic('users')}</div><div class="lbl">⚫ Inativos (${cfg.inativo}d+)</div><div class="val">${buckets.inativo.length}</div></div>
   </div>
   <div class="card pad" style="margin-bottom:16px">
     <div class="section-title"><h2>🔮 Previsão de recompra</h2><span class="sub">Estimativa pelo intervalo médio — não é certeza</span></div>
     <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;align-items:start">
       <div><b style="font-size:12.5px;color:var(--green)">Próximos da recompra (até 7 dias)</b>${proximos.length?proximos.slice(0,12).map(x=>recompraRow(x)).join(''):'<p style="font-size:12px;color:var(--muted)">Ninguém previsto para os próximos dias.</p>'}</div>
       <div><b style="font-size:12.5px;color:var(--red)">Já passou da média (oportunidade)</b>${atrasados.length?atrasados.slice(0,12).map(x=>recompraRow(x)).join(''):'<p style="font-size:12px;color:var(--muted)">Ninguém atrasado.</p>'}</div>
     </div>
   </div>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start">
     ${card('recuperar','Recuperar','🔴','#e01e26')}
     ${card('atencao','Atenção','🟡','#e08a00')}
     ${card('inativo','Inativos','⚫','#334155')}
     ${card('ativo','Ativos','🟢','#12a150')}
   </div>`;
};
function cliRow(c){const st=statusCliente(c.id);const d=diasSem(c.id);return`<div class="stat-line"><div style="display:flex;align-items:center;gap:8px"><div class="mini-ic" style="width:28px;height:28px;background:${st.bg};color:${st.cor};font-weight:800;font-size:11px">${initials(c.nome)}</div><div><b style="font-size:12.5px;cursor:pointer" onclick="verCliente('${c.id}')">${esc(c.nome)}</b><div style="font-size:11px;color:var(--muted)">${esc(c.bairro||'')} · ${d===Infinity?'sem compras':d+' dias'}</div></div></div>${c.whatsapp?`<a href="${lembreteWa(c)}" target="_blank"><button class="btn btn-ghost btn-sm" style="color:#128c43">${ic('wa')}</button></a>`:''}</div>`;}
function recompraRow(x){const c=x.c;return`<div class="stat-line"><div><b style="font-size:12.5px;cursor:pointer" onclick="verCliente('${c.id}')">${esc(c.nome)}</b><div style="font-size:11px;color:var(--muted)">${esc(x.prod||'')} · ~${x.iv}d · prev. ${fmtDate(x.prev)}</div></div>${c.whatsapp?`<a href="${lembreteWa(c)}" target="_blank"><button class="btn btn-ghost btn-sm" style="color:#128c43">${ic('wa')}</button></a>`:''}</div>`;}
function cfgRadar(){const cfg=radarCfg();modal('Ajustar prazos do Radar',`

function doLogin(){
  const u=$('#lgUser').value.trim().toLowerCase(),p=$('#lgPass').value;
  const user=DB.usuarios.find(x=>x.login.toLowerCase()===u&&x.senha===p);
  if(!user){toast('Usuário ou senha incorretos','err');return;}
  USER=user;
  $('#userName').textContent=user.nome;$('#userRole').textContent=user.papel;$('#userAv').textContent=initials(user.nome);
  $('#login').style.display='none';$('#app').style.display='block';
  buildNav();
  const first=NAV.flatMap(g=>g.items).find(allowed);
  CURRENT=first.id;go(first.id);
}

/* ============================================================
   LICENCIAMENTO / COBRANÇA MENSAL
   >>> PREENCHA OS 4 VALORES ABAIXO com os dados do SEU Supabase <<<
   Enquanto LIC_SUPABASE_URL estiver vazio, o sistema NÃO bloqueia
   (útil para testar/demonstrar). Veja o arquivo COMO-CONFIGURAR-LICENCA.md
   ============================================================ */
const LIC_SUPABASE_URL   = '';                 // ex.: 'https://abcdefgh.supabase.co'
const LIC_SUPABASE_ANON  = '';                 // sua chave anon (public) do Supabase
const LIC_TOLERANCIA_DIAS= 3;                  // dias que o cliente pode ficar offline antes de travar
const LIC_CONTATO_WA     = '5521993026719';    // seu WhatsApp para renovação (só números, com DDI 55)

function licGetKey(){return localStorage.getItem('consigaz_lic_key')||'';}
function licSetKey(k){localStorage.setItem('consigaz_lic_key',(k||'').trim());}
function licGetCache(){try{return JSON.parse(localStorage.getItem('consigaz_lic_cache'));}catch(e){return null;}}
function licSetCache(o){try{localStorage.setItem('consigaz_lic_cache',JSON.stringify(o));}catch(e){}}
async function verificarLicenca(chave){
  const r=await fetch(LIC_SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/verificar_licenca',{
    method:'POST',
    headers:{'apikey':LIC_SUPABASE_ANON,'Authorization':'Bearer '+LIC_SUPABASE_ANON,'Content-Type':'application/json'},
    body:JSON.stringify({p_chave:(chave||'').trim()})
  });
  if(!r.ok)throw new Error('http '+r.status);
  return await r.json(); // {ativo, valido_ate, nome} ou null
}
function licHost(){let h=document.getElementById('licView');if(!h){h=document.createElement('div');h.id='licView';document.body.appendChild(h);}
  h.style.cssText='position:fixed;inset:0;background:linear-gradient(160deg,#0d1b2f,#12307f);color:#fff;z-index:10000;overflow:auto;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px';return h;}
function licRemove(){const h=document.getElementById('licView');if(h)h.remove();}
function licLoading(msg){licHost().innerHTML=`<div style="text-align:center"><div style="font-size:40px">🔐</div><p style="margin-top:12px;opacity:.85">${esc(msg||'Verificando licença...')}</p></div>`;}
function licTelaAtivacao(erro){
  licHost().innerHTML=`<div style="max-width:400px;width:100%;text-align:center">
    <div style="font-size:44px">🔐</div>
    <h2 style="margin:12px 0 6px">Ative seu sistema</h2>
    <p style="opacity:.85;font-size:14px;line-height:1.6;margin-bottom:18px">Digite a chave de licença que você recebeu para começar a usar o ${esc(DB.config&&DB.config.empresa||'sistema')}.</p>
    ${erro?`<div style="background:#e01e26;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px">${esc(erro)}</div>`:''}
    <input id="licKey" placeholder="CHAVE-DA-LICENCA" style="width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;text-align:center;text-transform:uppercase;margin-bottom:12px">
    <button id="licAtivar" style="width:100%;padding:14px;border-radius:10px;background:#12a150;color:#fff;font-weight:800;font-size:15px">Ativar sistema</button>
    <a href="https://wa.me/${LIC_CONTATO_WA}?text=${encodeURIComponent('Olá! Quero ativar/assinar o sistema.')}" target="_blank" style="display:block;margin-top:14px;color:#fff;opacity:.85;font-size:13px">Não tenho chave — falar no WhatsApp</a>
  </div>`;
  const b=document.getElementById('licAtivar');if(b)b.onclick=()=>{const k=document.getElementById('licKey').value.trim();if(!k){return;}licSetKey(k);gateLicenca();};
}
function licTelaBloqueio(motivo,info){
  const msgs={expirado:'Sua assinatura venceu.',inativo:'Seu acesso está desativado.',invalida:'Chave de licença não encontrada.',offline:'Não foi possível validar sua licença. Conecte-se à internet e tente novamente.'};
  const val=(info&&info.valido_ate)?('Válido até: '+fmtDate(info.valido_ate)):'';
  licHost().innerHTML=`<div style="max-width:420px;width:100%;text-align:center">
    <div style="font-size:46px">${motivo==='offline'?'📡':'⛔'}</div>
    <h2 style="margin:12px 0 6px">${motivo==='offline'?'Sem conexão':'Acesso bloqueado'}</h2>
    <p style="opacity:.9;font-size:14px;line-height:1.6;margin-bottom:6px">${esc(msgs[motivo]||'Acesso indisponível.')}</p>
    ${val?`<p style="opacity:.7;font-size:12.5px;margin-bottom:16px">${esc(val)}</p>`:'<div style="height:10px"></div>'}
    ${motivo==='offline'
      ? `<button id="licRetry" style="width:100%;padding:14px;border-radius:10px;background:#12a150;color:#fff;font-weight:800;font-size:15px">Tentar novamente</button>`
      : `<a href="https://wa.me/${LIC_CONTATO_WA}?text=${encodeURIComponent('Olá! Quero renovar minha assinatura do sistema. Minha chave: '+licGetKey())}" target="_blank" style="display:block;padding:14px;border-radius:10px;background:#12a150;color:#fff;font-weight:800;font-size:15px;text-decoration:none">Renovar pelo WhatsApp</a>
         <div style="margin-top:16px"><input id="licKey" placeholder="Inserir outra chave" style="width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;text-align:center;text-transform:uppercase;margin-bottom:10px"><button id="licAtivar" style="width:100%;padding:12px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-weight:700">Reativar com nova chave</button></div>`}
  </div>`;
  const rt=document.getElementById('licRetry');if(rt)rt.onclick=()=>gateLicenca();
  const b=document.getElementById('licAtivar');if(b)b.onclick=()=>{const k=document.getElementById('licKey').value.trim();if(!k)return;licSetKey(k);gateLicenca();};
}
function licLiberar(){licRemove();const login=$('#login');if(login)login.style.display='flex';const u=$('#lgUser');if(u&&u.focus)u.focus();}
async function gateLicenca(){
  const login=$('#login');
  if(!LIC_SUPABASE_URL){if(login)login.style.display='flex';return;} // licenciamento desativado
  if(login)login.style.display='none';
  licLoading('Verificando licença...');
  const key=licGetKey();
  if(!key){licTelaAtivacao();return;}
  let r;
  try{r=await verificarLicenca(key);}
  catch(e){
    const c=licGetCache();
    if(c&&c.validoAte&&c.validoAte>=today()&&daysBetween(c.ultimoOk,today())<=LIC_TOLERANCIA_DIAS){licLiberar();return;}
    licTelaBloqueio('offline',c?{valido_ate:c.validoAte}:null);return;
  }
  if(r&&r.ativo&&r.valido_ate&&r.valido_ate>=today()){licSetCache({validoAte:r.valido_ate,ultimoOk:today(),nome:r.nome||''});licLiberar();return;}
  licTelaBloqueio(!r?'invalida':(r.ativo?'expirado':'inativo'),r);
}

window.addEventListener('hashchange',()=>{const h=location.hash||'';if(h.indexOf('#/acompanhar/')===0||h.indexOf('#/pedir')===0){handleHashRoute();}else{const tv=document.getElementById('trackView');const pv=document.getElementById('pedirView');if(tv||pv){if(tv)tv.remove();if(pv)pv.remove();location.reload();}}});
(function(){
  const h0=location.hash||'';
  if(h0.indexOf('#/acompanhar/')===0||h0.indexOf('#/pedir')===0){handleHashRoute();return;}
