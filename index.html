<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consigaz do Jovem — ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<style>
:root{
  --navy:#12307f; --navy-d:#0d2560; --navy-l:#1c46b0;
  --blue:#1e56d6; --blue-d:#1743b0;
  --red:#e01e26; --red-d:#b8161d;
  --ink:#0f1a3a; --muted:#5b6b8c; --muted-l:#8a97b4;
  --bg:#eef1f8; --card:#ffffff; --line:#e3e8f2;
  --green:#12a150; --green-bg:#e6f6ed;
  --amber:#e08a00; --amber-bg:#fdf1de;
  --red-bg:#fdeaec;
  --shadow:0 1px 2px rgba(15,26,58,.04),0 8px 24px rgba(15,26,58,.06);
  --shadow-lg:0 12px 40px rgba(15,26,58,.18);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9d3e6;border-radius:20px;border:2px solid var(--bg)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%,#1c46b0 0%,var(--navy) 45%,var(--navy-d) 100%);z-index:100}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:34px 30px;box-shadow:var(--shadow-lg)}
.login-logo{display:block;width:230px;max-width:80%;margin:0 auto 6px}
.login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:24px;font-weight:500}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fbfcff;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(30,86,214,.12)}
.field textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-sm);font-weight:700;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 4px 14px rgba(30,86,214,.35)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px)}
.btn-red{background:linear-gradient(180deg,var(--red),var(--red-d));color:#fff;box-shadow:0 4px 14px rgba(224,30,38,.3)}
.btn-red:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn-ghost:hover{background:#f6f8fd;border-color:#cdd6ea}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12.5px;font-weight:600}
.login-hint{margin-top:16px;text-align:center;font-size:11.5px;color:var(--muted-l)}
.login-hint b{color:var(--muted)}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#dfe6fb;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.side-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:11px}
.side-brand .chip{background:#fff;border-radius:12px;padding:7px 9px;display:flex;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.side-brand img{width:118px;display:block}
.side-nav{flex:1;overflow-y:auto;padding:8px 12px 20px}
.nav-group{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#8ea0da;padding:16px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c6d1f2;font-weight:600;font-size:13.5px;transition:.13s;margin-bottom:2px;position:relative}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:linear-gradient(90deg,var(--blue),var(--navy-l));color:#fff;box-shadow:0 4px 14px rgba(30,86,214,.4)}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .badge{background:rgba(255,255,255,.28)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:12px 24px;display:flex;align-items:center;gap:14px;z-index:30}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:none}
.topbar .crumb{color:var(--muted-l);font-size:12px;font-weight:600;margin-top:1px}
.search-wrap{position:relative;flex:1;max-width:420px;margin-left:8px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted-l)}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid var(--line);border-radius:30px;background:#f6f8fd}
.search-wrap input:focus{background:#fff;border-color:var(--blue);outline:none}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;z-index:60;max-height:400px;overflow-y:auto}
.search-results.show{display:block}
.sr-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sr-item:hover{background:#f6f8fd}
.sr-item:last-child{border-bottom:none}
.sr-item .n{font-weight:700}
.sr-item .m{font-size:12px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:9px;margin-left:auto;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.user-chip .who{line-height:1.15}
.user-chip .who b{font-size:13px}
.user-chip .who span{display:block;font-size:11px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:#fff}
.icon-btn:hover{background:#f6f8fd;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.content{padding:24px;max-width:1360px;width:100%;margin:0 auto;flex:1}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- COMPONENTS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.section-title h2{font-size:16px;font-weight:800}
.section-title .sub{color:var(--muted);font-size:12.5px;font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ic svg{width:19px;height:19px}
.kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.kpi .foot{font-size:11.5px;color:var(--muted-l);margin-top:4px;font-weight:500}
.ic.blue{background:#e7effe;color:var(--blue)} .ic.green{background:var(--green-bg);color:var(--green)}
.ic.red{background:var(--red-bg);color:var(--red)} .ic.amber{background:var(--amber-bg);color:var(--amber)}
.ic.navy{background:#e6ecfb;color:var(--navy)} .ic.purple{background:#eee9fd;color:#7c5cf0}

.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
.chart-card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.chart-box{position:relative;height:230px}
.chart-box.sm{height:200px}

table{width:100%;border-collapse:collapse}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#fafbfe}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8faff}
.t-strong{font-weight:700}
.t-money{font-variant-numeric:tabular-nums;font-weight:700}
td.r,th.r{text-align:right}
tr.cx-grp td{background:#f0f4ff;font-weight:800;color:var(--navy);text-transform:uppercase;font-size:11.5px;letter-spacing:.03em}
tr.cx-tot td{border-top:1.5px solid var(--line);font-weight:800;background:#fafbff}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)} .tag.blue{background:#e7effe;color:var(--blue)}
.tag.gray{background:#eef1f8;color:var(--muted)} .tag.navy{background:#e6ecfb;color:var(--navy)}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search-mini{position:relative;flex:1;min-width:180px;max-width:340px}
.toolbar .search-mini input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.toolbar .search-mini svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted-l)}
.seg{display:inline-flex;background:#eef1f8;border-radius:10px;padding:3px}
.seg button{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--line);margin-bottom:10px}
.empty h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.empty p{font-size:12.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,26,58,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:80;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .2s ease;margin:auto 0}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:800}
.modal-head .x{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-head .x:hover{background:#f0f3fa}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfe;border-radius:0 0 18px 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.mini-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.pill-actions{display:flex;gap:6px}
.pill-actions button{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--muted)}
.pill-actions button:hover{background:#f6f8fd;color:var(--ink)}
.pill-actions button.danger:hover{background:var(--red-bg);color:var(--red);border-color:#f6cdd0}
.pill-actions button svg{width:15px;height:15px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:200;display:flex;align-items:center;gap:9px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px}
.toast.ok{background:#0f8a45} .toast.err{background:var(--red-d)}

.hamb{display:none}
.side-backdrop{display:none}

/* ---------- PDV (quick sale) ---------- */
.pdv{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.prod-btn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;transition:.13s;position:relative}
.prod-btn:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(30,86,214,.14);transform:translateY(-2px)}
.prod-btn:active{transform:translateY(0)}
.prod-btn .pemoji{font-size:22px;margin-bottom:3px;line-height:1}
.prod-btn .pn{font-weight:700;font-size:12px;line-height:1.15}
.prod-btn .pp{color:var(--blue);font-weight:800;font-size:13px;margin-top:2px}
.prod-btn .pstock{font-size:10px;color:var(--muted-l);margin-top:2px}
.prod-btn.low{border-color:#f6cdd0}
.cart{position:sticky;top:80px}
.cart-items{max-height:280px;overflow-y:auto;margin:4px 0 12px}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-n{flex:1;min-width:0}
.cart-item .ci-n b{font-size:13px}
.cart-item .ci-n span{display:block;font-size:11.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px;background:#eef1f8;border-radius:9px;padding:2px}
.qty button{width:26px;height:26px;border-radius:7px;background:#fff;font-weight:800;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:13px}
.cart-total{border-top:1.5px dashed var(--line);padding-top:12px;margin-top:4px}
.ct-line{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--muted)}
.ct-line.big{font-size:19px;font-weight:800;color:var(--ink);padding-top:8px}
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pay-methods button{padding:10px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.13s}
.pay-methods button.active{border-color:var(--blue);background:#e7effe;color:var(--blue)}
.pay-methods button svg{width:15px;height:15px}

.stat-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.stat-line:last-child{border-bottom:none}
.progress{height:7px;background:#eef1f8;border-radius:20px;overflow:hidden;margin-top:6px}
.progress > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--green),#0f8a45)}

.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-head .big-av{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.info-grid .i-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.info-grid .i-val{font-weight:600;margin-top:2px}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.doc-grid .full{grid-column:1/-1}
.doc-grid .dg-l{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.doc-grid .dg-v{display:block;font-weight:600;font-size:13.5px;margin-top:1px}
.fi-line{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.mapa-wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.mapa-canvas{height:560px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);z-index:0;background:#e9edf3}
.mapa-panel{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.leaflet-container{border-radius:var(--r);font:inherit}
.cov{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:700}
.region-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.region-card .rc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.region-card .dotc{width:12px;height:12px;border-radius:50%;flex:none}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:16px;font-size:16px;font-weight:800;color:#fff;margin-bottom:10px;box-shadow:var(--shadow)}
@media(max-width:900px){.mapa-wrap{grid-template-columns:1fr}.mapa-canvas{height:380px}.mapa-panel{max-height:none}}

@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .chart-grid,.pdv{grid-template-columns:1fr}
  .cart{position:static}
}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .side-backdrop{display:none;position:fixed;inset:0;background:rgba(15,26,58,.4);z-index:39}
  .side-backdrop.open{display:block}
  .hamb{display:flex}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:16px}
  .search-wrap{display:none}
  .content{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .user-chip .who{display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" alt="Consigaz do Jovem">
    <p class="login-sub">Energia que move seu futuro</p>
    <div class="field">
      <label>Usuário</label>
      <input id="lgUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="lgPass" type="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="lgBtn">Entrar no sistema</button>

/* ========== FIADO / FINANCE HELPERS ========== */
const clienteById=id=>DB.clientes.find(c=>c.id===id);
const prodById=id=>DB.produtos.find(p=>p.id===id);
function fiadoDaVenda(v){return (v.pagamentos||[]).filter(p=>p.forma==='Fiado').reduce((s,p)=>s+p.valor,0);}
function recebidoDaVenda(v){return (v.recebimentos||[]).reduce((s,r)=>s+r.valor,0);}
function saldoFiado(v){return Math.max(0,fiadoDaVenda(v)-recebidoDaVenda(v));}
function statusFiado(v){
  const f=fiadoDaVenda(v); if(f<=0)return null;
  const s=saldoFiado(v);
  if(s<=0.001)return 'pago';
  if(v.vencimento && v.vencimento<today())return 'atrasado';
  if(recebidoDaVenda(v)>0)return 'parcial';
  return 'aberto';
}
const vendasFiado=()=>DB.vendas.filter(v=>fiadoDaVenda(v)>0);
const vendasEmAberto=()=>vendasFiado().filter(v=>saldoFiado(v)>0);
function formaResumo(v){
  const fs=[...new Set((v.pagamentos||[]).map(p=>p.forma))];
  return fs.length>1?'Misto':(fs[0]||'—');
}
function saldoCliente(id){return DB.vendas.filter(v=>v.clienteId===id).reduce((s,v)=>s+saldoFiado(v),0);}
function enderecoCompleto(c){if(!c)return'';return[c.endereco,c.numero?('nº '+c.numero):'',c.complemento,c.bairro,c.cidade].filter(Boolean).join(', ');}
function idadeDe(nasc){if(!nasc)return'';const d=new Date(nasc+'T00:00:00');if(isNaN(d))return'';const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return(a>=0&&a<130)?a+' anos':'';}
function grupoProduto(p){const cat=(p&&p.categoria)||'';const n=((p&&p.nome)||'').toLowerCase();if(cat==='Gás'||n.includes('gás')||n.includes('gas')||/\bp1?3\b|\bp20\b|\bp45\b/.test(n))return'Gás';if(cat==='Água'||n.includes('água')||n.includes('agua'))return'Água';if(cat==='Gelo'||n.includes('gelo'))return'Gelo';if(cat==='Carvão'||n.includes('carvão')||n.includes('carvao'))return'Carvão';return'Outros';}

function allowed(item){return item.roles.includes(USER.papel);}
function buildNav(){
  const nav=$('#sideNav');nav.innerHTML='';
  NAV.forEach(grp=>{
    const items=grp.items.filter(allowed);if(!items.length)return;
    const h=document.createElement('div');h.className='nav-group';h.textContent=grp.g;nav.appendChild(h);
    items.forEach(it=>{
      const a=document.createElement('a');a.className='nav-item'+(it.id===CURRENT?' active':'');a.dataset.id=it.id;
      let badge='';
      if(it.id==='fiado'){const n=vendasEmAberto().length;if(n)badge=`<span class="badge">${n}</span>`;}

      if(it.id==='estoque'){const n=DB.produtos.filter(p=>p.estoque<=p.estoqueMin).length;if(n)badge=`<span class="badge">${n}</span>`;}
      if(it.id==='entregas'){const n=DB.vendas.filter(v=>v.novo).length;if(n)badge=`<span class="badge" style="background:var(--red)">${n} novo${n>1?'s':''}</span>`;}

function findItem(id){for(const g of NAV)for(const it of g.items)if(it.id===id)return it;}

const GRUPOS_CAIXA=['Gás','Água','Gelo','Carvão','Outros'];
function vendaTs(v){return(v.data||'')+'T'+(v.hora||'00:00');}
function caixaVendas(s){
  const ini=s.abertura.data+'T'+(s.abertura.hora||'00:00');
  const fim=s.fechamento?(s.fechamento.data+'T'+(s.fechamento.hora||'23:59')):'9999-12-31T23:59';
  return DB.vendas.filter(v=>v.status!=='Cancelado'&&vendaTs(v)>=ini&&vendaTs(v)<=fim);
}
function caixaResumo(s){
  const vendas=caixaVendas(s);
  const iniD=s.abertura.data, fimD=s.fechamento?s.fechamento.data:'9999-12-31';
  const porForma={};let dinheiroVendas=0;
  vendas.forEach(v=>(v.pagamentos||[]).forEach(p=>{porForma[p.forma]=(porForma[p.forma]||0)+p.valor;if(p.forma==='Dinheiro')dinheiroVendas+=p.valor;}));
  let recebFiadoDinheiro=0;
  DB.vendas.forEach(v=>(v.recebimentos||[]).forEach(r=>{if(r.forma==='Dinheiro'&&r.data>=iniD&&r.data<=fimD)recebFiadoDinheiro+=r.valor;}));
  const mapP={};
  vendas.forEach(v=>v.itens.forEach(i=>{const k=i.produtoId||i.nome;const g=grupoProduto(prodById(i.produtoId)||{nome:i.nome});const o=mapP[k]||(mapP[k]={nome:i.nome,qtd:0,valor:0,grupo:g});o.qtd+=i.qtd;o.valor+=i.qtd*i.unit;}));
  const porProduto=Object.values(mapP).sort((a,b)=>b.valor-a.valor);
  const porGrupo={};porProduto.forEach(p=>{const g=porGrupo[p.grupo]||(porGrupo[p.grupo]={qtd:0,valor:0});g.qtd+=p.qtd;g.valor+=p.valor;});
  const supr=(s.suprimentos||[]).reduce((a,x)=>a+x.valor,0);
  const sang=(s.sangrias||[]).reduce((a,x)=>a+x.valor,0);
  const totalVendas=vendas.reduce((a,v)=>a+v.total,0);
  return{
    numVendas:vendas.length,
    totalVendas,
    subtotalProdutos:vendas.reduce((a,v)=>a+(v.subtotal||0),0),
    descontoTotal:vendas.reduce((a,v)=>a+(v.desconto||0),0),
    taxaTotal:vendas.reduce((a,v)=>a+(v.taxaEntrega||0),0),
    qtdItens:vendas.reduce((a,v)=>a+v.itens.reduce((b,i)=>b+i.qtd,0),0),
    porForma,porProduto,porGrupo,
    dinheiroVendas,recebFiadoDinheiro,
    suprimentos:supr,sangrias:sang,
    valorInicial:s.abertura.valorInicial||0,
    dinheiroEsperado:(s.abertura.valorInicial||0)+dinheiroVendas+recebFiadoDinheiro+supr-sang
  };
}

const GRUPOS_FORMA=['Dinheiro','PIX','Cartão de débito','Cartão de crédito','Gás do Povo','Fiado'];
function detalheProdutoHTML(r){
  if(!r.porProduto.length)return'<div class="empty" style="padding:22px 0">'+ic('box')+'<p>Nenhuma venda registrada ainda.</p></div>';
  let rows='';
  GRUPOS_CAIXA.forEach(g=>{
    const prods=r.porProduto.filter(p=>p.grupo===g);if(!prods.length)return;
    const gr=r.porGrupo[g]||{qtd:0,valor:0};
    rows+=`<tr class="cx-grp"><td>${g}</td><td class="r">${gr.qtd}</td><td class="t-money">${money(gr.valor)}</td></tr>`;
    prods.forEach(p=>{rows+=`<tr><td style="padding-left:20px">${esc(p.nome)}</td><td class="r">${p.qtd}</td><td class="t-money">${money(p.valor)}</td></tr>`;});
  });
  return`<div class="tbl-wrap"><table><thead><tr><th>Produto</th><th style="text-align:right">Qtd</th><th>Valor</th></tr></thead><tbody>${rows}
    <tr class="cx-tot"><td>Total em produtos</td><td class="r">${r.porProduto.reduce((a,p)=>a+p.qtd,0)}</td><td class="t-money">${money(r.porProduto.reduce((a,p)=>a+p.valor,0))}</td></tr>
  </tbody></table></div>`;
}
function movHTML(s){
  const sup=(s.suprimentos||[]),san=(s.sangrias||[]);
  if(!sup.length&&!san.length)return'<p style="font-size:12.5px;color:var(--muted)">Sem suprimentos ou sangrias registrados.</p>';
  const line=(x,tipo)=>`<div class="stat-line"><span>${tipo==='s'?'↑':'↓'} ${esc(x.hora||'')} ${x.motivo?'· '+esc(x.motivo):''}</span><b style="color:${tipo==='s'?'var(--green)':'var(--red)'}">${tipo==='s'?'+':'−'}${money(x.valor)}</b></div>`;
  return sup.map(x=>line(x,'s')).join('')+san.map(x=>line(x,'g')).join('');
}
function abrirCaixa(){
  const ini=+($('#cxIni').value)||0;const op=($('#cxOp').value||'').trim()||USER.nome;
  DB.caixaAtual={id:uid(),abertura:{data:today(),hora:nowTime(),valorInicial:ini,operador:op},suprimentos:[],sangrias:[],fechamento:null};
  save();buildNav();toast('Caixa aberto','ok');RENDER.caixa();
}
function movCaixa(tipo){
  const s=DB.caixaAtual;if(!s)return;
  const isS=tipo==='suprimento';
  modal(isS?'Suprimento (entrada de dinheiro)':'Sangria (retirada de dinheiro)',`
   <div class="form-grid">
     <div class="field"><label>Valor</label><input type="number" id="mvVal" value="0" step="0.01"></div>
     <div class="field full"><label>Motivo</label><input id="mvMot" placeholder="${isS?'Ex: reforço de troco':'Ex: pagamento de fornecedor'}"></div>
   </div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="mvSave">Registrar</button>`);
  $('#mvSave').onclick=()=>{const val=+$('#mvVal').value||0;if(val<=0){toast('Informe um valor','err');return;}
    const item={hora:nowTime(),valor:val,motivo:$('#mvMot').value};
    if(isS){s.suprimentos=s.suprimentos||[];s.suprimentos.push(item);}else{s.sangrias=s.sangrias||[];s.sangrias.push(item);}
    save();closeModal();toast('Movimentação registrada','ok');RENDER.caixa();};
}
function fecharCaixa(){
  const s=DB.caixaAtual;if(!s)return;const r=caixaResumo(s);
  modal('Fechar caixa',`
   <div style="background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px">
     <div class="stat-line"><span>Troco de abertura</span><b class="tnum">${money(r.valorInicial)}</b></div>
     <div class="stat-line"><span>Vendas em dinheiro</span><b class="tnum">${money(r.dinheiroVendas)}</b></div>
     ${r.recebFiadoDinheiro?`<div class="stat-line"><span>Fiado recebido (dinheiro)</span><b class="tnum">${money(r.recebFiadoDinheiro)}</b></div>`:''}
     ${r.suprimentos?`<div class="stat-line"><span>Suprimentos</span><b class="tnum" style="color:var(--green)">+ ${money(r.suprimentos)}</b></div>`:''}
     ${r.sangrias?`<div class="stat-line"><span>Sangrias</span><b class="tnum" style="color:var(--red)">− ${money(r.sangrias)}</b></div>`:''}
     <div class="stat-line" style="font-size:15px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px"><b>Dinheiro esperado</b><b class="tnum">${money(r.dinheiroEsperado)}</b></div>
   </div>
   <div class="form-grid">
     <div class="field"><label>Valor contado na gaveta</label><input type="number" id="cxCont" value="${r.dinheiroEsperado.toFixed(2)}" step="0.01"></div>
     <div class="field"><label>Diferença</label><input id="cxDif" value="—" readonly style="font-weight:700"></div>
     <div class="field full"><label>Observação (opcional)</label><input id="cxObs" placeholder="Ex: falta conferir sangria da tarde"></div>
   </div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-red btn-sm" id="cxFecharBtn">${ic('check')} Confirmar fechamento</button>`);
  const upd=()=>{const c=+$('#cxCont').value||0;const d=c-r.dinheiroEsperado;const el=$('#cxDif');el.value=(d>0?'+':'')+money(d)+(Math.abs(d)<0.01?' (ok)':(d<0?' (falta)':' (sobra)'));el.style.color=Math.abs(d)<0.01?'var(--green)':(d<0?'var(--red)':'var(--navy)');};
  $('#cxCont').addEventListener('input',upd);upd();
  $('#cxFecharBtn').onclick=()=>{
    const contado=+$('#cxCont').value||0;
    s.fechamento={data:today(),hora:nowTime(),operador:USER.nome,valorContado:contado,observacao:$('#cxObs').value,diferenca:contado-r.dinheiroEsperado};
    s.numVendas=r.numVendas;s.resumo=r;
    DB.caixas=DB.caixas||[];DB.caixas.unshift(s);DB.caixaAtual=null;
    save();closeModal();buildNav();toast('Caixa fechado','ok');
    RENDER.caixa();imprimirCaixa(s);
  };
}

function imprimirCaixa(s){

   <div class="c b">PRODUTOS VENDIDOS</div>
   <table>${prodRows||'<tr><td class="c muted">sem vendas</td></tr>'}</table>
   <div class="row b"><span>TOTAL PRODUTOS</span><span>${money(r.porProduto.reduce((a,p)=>a+p.valor,0))}</span></div>
   <hr class="hr">
   <div class="c b">FORMAS DE PAGAMENTO</div>
   ${formaRows||'<div class="c muted">—</div>'}

   <div class="row muted"><span>Nº de vendas</span><span>${r.numVendas}</span></div>

   <div class="row"><span>Troco abertura</span><span>${money(r.valorInicial)}</span></div>
   <div class="row"><span>+ Dinheiro vendas</span><span>${money(r.dinheiroVendas)}</span></div>
   ${r.recebFiadoDinheiro?`<div class="row"><span>+ Fiado (dinheiro)</span><span>${money(r.recebFiadoDinheiro)}</span></div>`:''}
   ${r.suprimentos?`<div class="row"><span>+ Suprimentos</span><span>${money(r.suprimentos)}</span></div>`:''}
   ${r.sangrias?`<div class="row"><span>- Sangrias</span><span>${money(r.sangrias)}</span></div>`:''}
   <div class="row b"><span>DINHEIRO ESPERADO</span><span>${money(r.dinheiroEsperado)}</span></div>
   ${!aberto?`<div class="row"><span>Contado</span><span>${money(s.fechamento.valorContado)}</span></div><div class="row b"><span>DIFERENCA</span><span>${s.fechamento.diferenca>0?'+':''}${money(s.fechamento.diferenca)}</span></div>${s.fechamento.observacao?`<div class="muted">Obs: ${esc(s.fechamento.observacao)}</div>`:''}`:''}
   <hr class="hr">
   <div class="c muted">${esc(cf.empresa||'')}</div>

/* ========== CONTAS A PAGAR ========== */
function contaStatus(c){if(c.status==='paga')return'paga';if(c.vencimento<today())return'vencida';if(c.vencimento===today())return'vencendo';return'a-vencer';}
RENDER.pagar=function(){
  DB.contas.forEach(c=>{if(c.status!=='paga')c.status=contaStatus(c);});
  const mk=curMonth();const mesContas=DB.contas.filter(c=>monthKey(c.vencimento)===mk);
  const totalMes=mesContas.reduce((s,c)=>s+c.valor,0);
  const pagas=mesContas.filter(c=>c.status==='paga').reduce((s,c)=>s+c.valor,0);
  const pend=totalMes-pagas;
  const vMes=DB.vendas.filter(v=>monthKey(v.data)===mk).reduce((s,v)=>s+v.total,0);
  const kpi=(icn,cls,lbl,val,foot)=>`<div class="kpi"><div class="ic ${cls}">${ic(icn)}</div><div class="lbl">${lbl}</div><div class="val tnum">${val}</div>${foot?`<div class="foot">${foot}</div>`:''}</div>`;
  $('#content').innerHTML=`
   <div class="kpis">
     ${kpi('down','green','Receita do mês',money(vMes))}
     ${kpi('up','red','Despesas do mês',money(totalMes))}
     ${kpi('chart','blue','Resultado estimado',money(vMes-totalMes))}
     ${kpi('clock','amber','Pendente a pagar',money(pend))}
   </div>
   <div class="toolbar"><div style="flex:1"></div><button class="btn btn-primary btn-sm" onclick="formConta()">${ic('plus')} Nova conta</button></div>
   <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Conta</th><th>Categoria</th><th>Fornecedor</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead><tbody id="contaTbody"></tbody></table></div></div>`;
  renderContas();
};
function renderContas(){
  const tb=$('#contaTbody');if(!tb)return;
  const list=[...DB.contas].sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const m={'a-vencer':['gray','A vencer'],'vencendo':['amber','Vence hoje'],'vencida':['red','Vencida'],'paga':['green','Paga']};
  tb.innerHTML=list.length?list.map(c=>{const[cls,txt]=m[c.status]||['gray',c.status];
   return`<tr>
     <td class="t-strong">${esc(c.nome)}</td><td><span class="tag gray">${esc(c.categoria)}</span></td><td>${esc(c.fornecedor||'—')}</td>
     <td class="t-money">${money(c.valor)}</td>
     <td style="font-size:12px;color:${c.status==='vencida'?'var(--red)':'var(--muted)'}">${fmtDate(c.vencimento)}</td>
     <td><span class="tag ${cls}"><span class="dot"></span>${txt}</span></td>
     <td><div class="pill-actions">${c.status!=='paga'?`<button style="color:var(--green)" onclick="pagarConta('${c.id}')" title="Marcar como paga">${ic('check')}</button>`:''}<button onclick="formConta('${c.id}')" title="Editar">${ic('edit')}</button><button class="danger" onclick="delConta('${c.id}')" title="Excluir">${ic('trash')}</button></div></td>
   </tr>`;}).join(''):'<tr><td colspan="7"><div class="empty">'+ic('up')+'<h4>Nenhuma conta</h4><p>Cadastre suas despesas do mês.</p></div></td></tr>';
}
function formConta(id){
  const c=id?DB.contas.find(x=>x.id===id):{};
  const cats=['Compra de gás','Funcionários','Energia','Água','Internet','Aluguel','Combustível','Manutenção','Marketing','Impostos','Outras despesas'];
  modal(id?'Editar conta':'Nova conta a pagar',`
   <div class="form-grid">
     <div class="field full"><label>Nome da conta *</label><input id="c_nome" value="${esc(c.nome)}"></div>
     <div class="field"><label>Categoria</label><select id="c_cat">${cats.map(x=>`<option ${c.categoria===x?'selected':''}>${x}</option>`).join('')}</select></div>
     <div class="field"><label>Fornecedor</label><input id="c_forn" value="${esc(c.fornecedor)}"></div>
     <div class="field"><label>Valor *</label><input type="number" id="c_val" value="${c.valor||''}"></div>
     <div class="field"><label>Vencimento</label><input type="date" id="c_venc" value="${c.vencimento||today()}"></div>
     <div class="field full"><label>Observação</label><textarea id="c_obs">${esc(c.obs)}</textarea></div>
   </div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="saveConta">Salvar</button>`);
  $('#saveConta').onclick=()=>{
    const nome=$('#c_nome').value.trim(),valor=+$('#c_val').value||0;
    if(!nome||!valor){toast('Preencha nome e valor','err');return;}
    const data={nome,categoria:$('#c_cat').value,fornecedor:$('#c_forn').value,valor,vencimento:$('#c_venc').value,obs:$('#c_obs').value};
    if(id){Object.assign(c,data);c.status=contaStatus(c);}else{const nc={id:uid(),...data,pagamento:'',forma:''};nc.status=contaStatus(nc);DB.contas.push(nc);}
    save();closeModal();toast('Conta salva','ok');buildNav();RENDER.pagar();
  };
}
function pagarConta(id){
  const c=DB.contas.find(x=>x.id===id);
  modal('Pagar conta',`<p style="margin-bottom:14px;font-size:14px">${esc(c.nome)} — <b>${money(c.valor)}</b></p>
   <div class="form-grid"><div class="field"><label>Data do pagamento</label><input type="date" id="pg_data" value="${today()}"></div><div class="field"><label>Forma</label><select id="pg_forma"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>Transferência</option></select></div></div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="pgSave">Confirmar pagamento</button>`);
  $('#pgSave').onclick=()=>{c.status='paga';c.pagamento=$('#pg_data').value;c.forma=$('#pg_forma').value;save();closeModal();toast('Conta paga','ok');buildNav();RENDER.pagar();};
}
function delConta(id){confirmDel('Excluir esta conta?',()=>{DB.contas=DB.contas.filter(c=>c.id!==id);save();buildNav();RENDER.pagar();toast('Conta excluída','ok');});}

  $('#content').innerHTML=`
   ${baixo.length?`<div class="card pad" style="border-color:#f6cdd0;background:var(--red-bg);margin-bottom:16px;display:flex;align-items:center;gap:12px"><div class="mini-ic" style="background:#fff;color:var(--red)">${ic('alert')}</div><div><b>${baixo.length} produto(s) no estoque mínimo</b><div style="font-size:12.5px;color:var(--red-d)">${baixo.map(p=>p.nome+' ('+p.estoque+' un)').join(', ')}</div></div></div>`:''}
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
   ${DB.produtos.map(p=>{const pct=p.estoqueMin>0?Math.min(100,p.estoque/(p.estoqueMin*2)*100):100;const low=p.estoque<=p.estoqueMin;
    return`<div class="card pad">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${p.emoji}</span><div><b style="font-size:15px">${esc(p.nome)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(p.categoria)}</div></div></div>
        ${low?'<span class="tag red"><span class="dot"></span>Baixo</span>':'<span class="tag green"><span class="dot"></span>OK</span>'}
      </div>
      <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:28px;font-weight:800" class="tnum">${p.estoque}</span><span style="color:var(--muted);font-size:13px">un · mín ${p.estoqueMin}</span></div>
      <div class="progress"><i style="width:${pct}%;background:${low?'linear-gradient(90deg,var(--red),var(--red-d))':'linear-gradient(90deg,var(--green),#0f8a45)'}"></i></div>
      ${p.controlaVasilhame?`<div style="display:flex;gap:8px;margin-top:14px">
        <div style="flex:1;background:var(--green-bg);border-radius:10px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--green);font-weight:700">CHEIOS</div><div style="font-size:20px;font-weight:800;color:var(--green)" class="tnum">${p.cheios}</div></div>
        <div style="flex:1;background:#f0f3fa;border-radius:10px;padding:9px;text-align:center"><div style="font-size:11px;color:var(--muted);font-weight:700">VAZIOS</div><div style="font-size:20px;font-weight:800;color:var(--muted)" class="tnum">${p.vazios}</div></div>
      </div>`:''}
      <div style="font-size:11.5px;color:var(--muted-l);margin-top:12px">Última entrada: ${fmtDate(p.ultimaEntrada)}</div>
      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px" onclick="entradaEstoque('${p.id}')">${ic('down')} Registrar entrada</button>
    </div>`;}).join('')}
   </div>`;
};
function entradaEstoque(id){
  const p=prodById(id);
  modal('Entrada de estoque',`<p style="margin-bottom:14px;font-size:14px">${p.emoji} <b>${esc(p.nome)}</b> — atual: ${p.estoque} un</p>
   <div class="form-grid">
     <div class="field"><label>Quantidade recebida</label><input type="number" id="e_qtd" value="10"></div>
     <div class="field"><label>Data</label><input type="date" id="e_data" value="${today()}"></div>
     ${p.controlaVasilhame?`<div class="field full"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="e_troca" checked style="width:auto"> Trocar vazios por cheios (devolução ao distribuidor)</label></div>`:''}
   </div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="eSave">Confirmar entrada</button>`);
  $('#eSave').onclick=()=>{
    const q=+$('#e_qtd').value||0;p.estoque+=q;p.ultimaEntrada=$('#e_data').value;
    if(p.controlaVasilhame){p.cheios+=q;if($('#e_troca')?.checked)p.vazios=Math.max(0,p.vazios-q);}
    save();closeModal();toast('Entrada de '+q+' un registrada','ok');buildNav();RENDER.estoque();
  };
}

/* ========== ENTREGAS ========== */
RENDER.entregas=function(){
  let entregas=DB.vendas.filter(v=>v.status!=='Cancelado');
  entregas=entregas.filter(v=>v.status!=='Entregue'||v.data===today());
  entregas.sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
  const ents=entregadores();
  const emRota=entregas.filter(v=>v.status==='Saiu para entrega');
  const disponiveis=ents.filter(u=>!emRota.some(v=>v.entregadorId===u.id));
  const cols=[['Pedido recebido','Aguardando'],['Preparando','Preparando'],['Saiu para entrega','A caminho'],['Entregue','Entregue']];
  const tmp=tempoMedioEntregaMin(DB.vendas.filter(v=>v.data===today()&&tsOf(v,'Entregue')));
  const kpi=(icn,cls,lbl,val)=>`<div class="kpi"><div class="ic ${cls}">${ic(icn)}</div><div class="lbl">${lbl}</div><div class="val tnum">${val}</div></div>`;
  $('#content').innerHTML=`
   <div class="kpis">
     ${kpi('truck','navy','Em andamento',entregasEmAndamento().length)}
     ${kpi('pin','blue','A caminho agora',emRota.length)}
     ${kpi('users','green','Entregadores livres',disponiveis.length+'/'+ents.length)}
     ${kpi('clock','amber','Tempo médio (hoje)',tmp!=null?tmp+' min':'—')}
   </div>
   <div class="card pad" style="margin-bottom:16px">
     <div class="section-title"><h2>Entregadores</h2><span class="sub">${ents.length} cadastrados</span></div>
     <div style="display:flex;gap:10px;flex-wrap:wrap">
       ${ents.map(u=>{const carga=emRota.filter(v=>v.entregadorId===u.id).length;return`<div class="region-card" style="min-width:180px"><div class="rc-h"><div class="mini-ic" style="background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;font-weight:800;font-size:12px">${initials(u.nome)}</div><div><b style="font-size:13px">${esc(u.nome)}</b><div style="font-size:11px;color:${carga?'var(--navy)':'var(--green)'}">${carga?carga+' em rota':'disponível'}</div></div></div></div>`;}).join('')||'<span style="font-size:12.5px;color:var(--muted)">Nenhum entregador. Cadastre em Usuários.</span>'}
     </div>
   </div>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-items:start">
   ${cols.map(([st,label])=>{const items=entregas.filter(v=>v.status===st);const clr={'Pedido recebido':'blue','Preparando':'amber','Saiu para entrega':'navy','Entregue':'green'}[st];
    return`<div class="card pad" style="background:#fafbfe">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><b style="font-size:13.5px">${label}</b><span class="tag ${clr}">${items.length}</span></div>
      ${items.length?items.map(v=>{const c=clienteById(v.clienteId);const cov=c?coberturaCliente(c):null;return`
        <div class="card pad" style="padding:12px;margin-bottom:10px;box-shadow:none;${v.novo?'border:2px solid var(--red);background:#fff6f6':''}">
          <div style="display:flex;justify-content:space-between;align-items:center"><b>#${v.numero}${v.novo?' <span style="color:var(--red);font-size:10px;font-weight:800">🔔 NOVO</span>':''}</b><span style="font-size:11px;color:var(--muted)">${esc(v.hora)}</span></div>
          <div style="font-size:13px;font-weight:600;margin-top:4px">${esc(c?.nome||'Avulso')}</div>
          <div style="font-size:11.5px;color:var(--muted)">${esc(v.endereco||'Retirada no balcão')}</div>
          ${v.origem==='Pedido online'?`<div style="font-size:10.5px;color:var(--blue);font-weight:700;margin-top:2px">🌐 Pedido online</div>`:''}
          ${cov&&cov.area?`<div style="font-size:11px;color:${cov.cor};font-weight:600;margin-top:2px">${cov.icon} ${esc(cov.area.nome)}</div>`:''}
          <div style="font-size:11.5px;color:var(--muted);margin-top:4px">${v.itens.map(i=>i.qtd+'x '+i.nome).join(', ')}</div>
          <div style="margin-top:8px"><span class="tag gray">${formaResumo(v)}</span></div>
          ${st==='Pedido recebido'||st==='Preparando'?`<select onchange="atribuirEntregador('${v.id}',this.value)" style="width:100%;margin-top:8px;padding:7px;border:1.5px solid var(--line);border-radius:8px;font-size:12px"><option value="">${v.entregador?esc(v.entregador):'Atribuir entregador...'}</option>${ents.map(u=>`<option value="${u.id}" ${v.entregadorId===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>`:v.entregador?`<div style="font-size:11.5px;color:var(--navy);font-weight:600;margin-top:8px">🛵 ${esc(v.entregador)}</div>`:''}
          <div style="display:flex;gap:6px;margin-top:8px">
            ${st!=='Entregue'?`<button class="btn btn-primary btn-sm" style="flex:1" onclick="avancarEntrega('${v.id}')">${st==='Saiu para entrega'?'Entregue ✓':'Avançar →'}</button>`:'<div style="flex:1;text-align:center;color:var(--green);font-weight:700;font-size:12px">'+ic('check')+' Concluído</div>'}
            <button class="btn btn-ghost btn-sm" onclick="verVenda('${v.id}')" title="Detalhes">${ic('eye')}</button>
            ${c?.whatsapp?`<button class="btn btn-ghost btn-sm" style="color:#128c43" onclick="enviarWhats('${v.id}')" title="Avisar cliente no WhatsApp">${ic('wa')}</button>`:''}
          </div>
        </div>`;}).join(''):'<div style="text-align:center;color:var(--muted-l);font-size:12px;padding:16px 0">Vazio</div>'}
    </div>`;}).join('')}
   </div>`;
  const novos=DB.vendas.filter(v=>v.novo);
  if(novos.length){beep();novos.forEach(v=>v.novo=false);save();buildNav();}
};
function beep(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.35);o.start();o.stop(ctx.currentTime+.36);}catch(e){}}
function avancarEntrega(id){
  const v=DB.vendas.find(x=>x.id===id);
  const flow=['Pedido recebido','Preparando','Saiu para entrega','Entregue'];
  const i=flow.indexOf(v.status);
  let novo=i<0?'Preparando':(i<flow.length-1?flow[i+1]:'Entregue');
  setStatusPedido(v,novo);
  if(v.status==='Saiu para entrega'){if(!v.entregador){const u=entregadores()[0];if(u){v.entregadorId=u.id;v.entregador=u.nome;}}if(!v.token)v.token='trk'+Math.random().toString(36).slice(2,10);}
  if(v.status==='Entregue')v.coordEntregador=null;
  save();toast('Pedido → '+v.status,'ok');
  const c=clienteById(v.clienteId);
  if(c&&c.whatsapp&&(DB.config.waTemplates||{})[v.status]){modal('Atualizar cliente?',`<p style="font-size:14px">Enviar aviso de "<b>${esc(v.status)}</b>" para ${esc(c.nome)} no WhatsApp?</p>`,`<button class="btn btn-ghost btn-sm" onclick="closeModal();RENDER.entregas()">Agora não</button><button class="btn btn-primary btn-sm" onclick="closeModal();enviarWhats('${v.id}','${v.status}');RENDER.entregas()">${ic('wa')} Enviar</button>`);}
  else RENDER.entregas();
}
function atribuirEntregador(id,uid_){if(!uid_)return;const v=DB.vendas.find(x=>x.id===id);const u=DB.usuarios.find(x=>x.id===uid_);if(!v||!u)return;v.entregadorId=u.id;v.entregador=u.nome;save();toast('Atribuído a '+u.nome,'ok');RENDER.entregas();}

  gerarRelatorio();
};
function relPeriodo(k){const x=new Date();let ini=new Date();
  if(k==='hoje'){}else if(k==='semana'){ini.setDate(ini.getDate()-6);}else if(k==='15'){ini.setDate(ini.getDate()-14);}else if(k==='30'){ini.setDate(ini.getDate()-29);}else if(k==='mes'){ini.setDate(1);}
  REL_INI=ini.toISOString().slice(0,10);REL_FIM=today();$('#relIni').value=REL_INI;$('#relFim').value=REL_FIM;gerarRelatorio();}
function inRange(d){return d>=REL_INI&&d<=REL_FIM;}
let REL_DATA={cols:[],rows:[],title:''};
function gerarRelatorio(){
  REL_INI=$('#relIni').value;REL_FIM=$('#relFim').value;REL_TIPO=$('#relTipo').value;
  const vendas=DB.vendas.filter(v=>inRange(v.data));
  let cols=[],rows=[],title='',resumo='';
  if(REL_TIPO==='fechamento'){
    title='Fechamento por dia (produtos)';
    const prods=DB.produtos;
    const dias=[...new Set(vendas.map(v=>v.data))].sort();
    cols=['Data',...prods.map(p=>p.nome),'Total itens','Faturamento'];
    const totCol={};let totItens=0,totFat=0;let avulso=0,totAvulso=0;
    rows=dias.map(dia=>{
      const vd=vendas.filter(v=>v.data===dia);
      const qty={};let itens=0,fat=0,av=0;
      vd.forEach(v=>{fat+=v.total;v.itens.forEach(i=>{const pid=i.produtoId;if(pid&&prods.some(p=>p.id===pid)){qty[pid]=(qty[pid]||0)+i.qtd;}else{av+=i.qtd;}itens+=i.qtd;});});
      prods.forEach(p=>{totCol[p.id]=(totCol[p.id]||0)+(qty[p.id]||0);});
      totItens+=itens;totFat+=fat;totAvulso+=av;
      return [fmtDate(dia),...prods.map(p=>qty[p.id]||0),itens,money(fat)];
    });
    if(rows.length)rows.push(['TOTAIS',...prods.map(p=>totCol[p.id]||0),totItens,money(totFat)]);
    resumo=`${dias.length} dia(s) · ${totItens} itens vendidos · ${money(totFat)}`;
  }else if(REL_TIPO==='vendas'){
    title='Relatório de Vendas';cols=['Pedido','Data','Cliente','Itens','Total','Pagamento','Status'];
    rows=vendas.map(v=>['#'+v.numero,fmtDate(v.data),clienteById(v.clienteId)?.nome||'Avulso',v.itens.reduce((s,i)=>s+i.qtd,0),money(v.total),formaResumo(v),v.status]);
    resumo=`${vendas.length} vendas · Total ${money(vendas.reduce((s,v)=>s+v.total,0))}`;
  }else if(REL_TIPO==='faturamento'){
    title='Faturamento por dia';const byDay={};vendas.forEach(v=>byDay[v.data]=(byDay[v.data]||0)+v.total);
    cols=['Data','Pedidos','Faturamento'];rows=Object.keys(byDay).sort().map(d=>[fmtDate(d),vendas.filter(v=>v.data===d).length,money(byDay[d])]);
    resumo=`Total no período: ${money(vendas.reduce((s,v)=>s+v.total,0))}`;
  }else if(REL_TIPO==='gaspovo'){
    title='Relatório Gás do Povo';
    const gp=vendas.filter(v=>(v.pagamentos||[]).some(p=>p.forma==='Gás do Povo'));
    cols=['Data','Pedido','Cliente','Produtos','Botijões','Valor','Operador','Identificador'];
    rows=gp.map(v=>{const botij=v.itens.reduce((s,i)=>s+(grupoProduto(prodById(i.produtoId)||{nome:i.nome})==='Gás'?i.qtd:0),0);const valGP=(v.pagamentos||[]).filter(p=>p.forma==='Gás do Povo').reduce((s,p)=>s+p.valor,0);return[fmtDate(v.data),'#'+v.numero,clienteById(v.clienteId)?.nome||'Avulso',v.itens.map(i=>i.qtd+'x '+i.nome).join(', '),botij,money(valGP),v.operador||'—',v.gasPovoId||'—'];});
    const totBot=gp.reduce((s,v)=>s+v.itens.reduce((a,i)=>a+(grupoProduto(prodById(i.produtoId)||{nome:i.nome})==='Gás'?i.qtd:0),0),0);
    const totVal=gp.reduce((s,v)=>s+(v.pagamentos||[]).filter(p=>p.forma==='Gás do Povo').reduce((a,p)=>a+p.valor,0),0);
    const clis=new Set(gp.map(v=>v.clienteId).filter(Boolean)).size;
    if(rows.length)rows.push(['TOTAIS','','',clis+' clientes',totBot,money(totVal),'','']);
    resumo=`${gp.length} vendas · ${totBot} botijões · ${money(totVal)} · ${clis} clientes`;
  }else if(REL_TIPO==='origem'){
    title='Origem dos clientes / vendas';
    const origens={};DB.clientes.forEach(c=>{const o=c.origem||'Não informado';origens[o]=origens[o]||{cli:0,ped:0,fat:0};origens[o].cli++;});
    vendas.forEach(v=>{const c=clienteById(v.clienteId);const o=(c&&c.origem)||'Não informado';origens[o]=origens[o]||{cli:0,ped:0,fat:0};origens[o].ped++;origens[o].fat+=v.total;});
    cols=['Origem','Clientes','Pedidos no período','Faturamento'];
    rows=Object.entries(origens).sort((a,b)=>b[1].fat-a[1].fat).map(([o,d])=>[o,d.cli,d.ped,money(d.fat)]);
    resumo=`${DB.clientes.length} clientes cadastrados`;
  }else if(REL_TIPO==='fiado'){
    title='Fiado / Contas a receber';const fs=vendasFiado().filter(v=>inRange(v.data));
    cols=['Cliente','Pedido','Valor','Recebido','Saldo','Vencimento','Situação'];
    rows=fs.map(v=>[clienteById(v.clienteId)?.nome||'Avulso','#'+v.numero,money(fiadoDaVenda(v)),money(recebidoDaVenda(v)),money(saldoFiado(v)),fmtDate(v.vencimento),({aberto:'Em aberto',parcial:'Parcial',pago:'Pago',atrasado:'Atrasado'}[statusFiado(v)])]);
    resumo=`A receber: ${money(fs.reduce((s,v)=>s+saldoFiado(v),0))}`;
  }else if(REL_TIPO==='pagar'){
    title='Contas a pagar';const cs=DB.contas.filter(c=>inRange(c.vencimento));
    cols=['Conta','Categoria','Fornecedor','Valor','Vencimento','Status'];
    rows=cs.map(c=>[c.nome,c.categoria,c.fornecedor||'—',money(c.valor),fmtDate(c.vencimento),({'a-vencer':'A vencer','vencendo':'Vence hoje','vencida':'Vencida','paga':'Paga'}[c.status])]);
    resumo=`Total: ${money(cs.reduce((s,c)=>s+c.valor,0))}`;
  }else if(REL_TIPO==='inadimplentes'){
    title='Clientes inadimplentes';const map={};vendasEmAberto().forEach(v=>{map[v.clienteId]=(map[v.clienteId]||0)+saldoFiado(v);});
    cols=['Cliente','Telefone','Bairro','Valor em aberto'];
    rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([id,val])=>{const c=clienteById(id);return[c?.nome||'—',c?.telefone||'—',c?.bairro||'—',money(val)];});
    resumo=`${rows.length} inadimplentes · ${money(Object.values(map).reduce((a,b)=>a+b,0))}`;
  }else if(REL_TIPO==='estoque'){
    title='Posição de estoque';cols=['Produto','Categoria','Estoque','Mínimo','Cheios','Vazios','Situação'];
    rows=DB.produtos.map(p=>[p.nome,p.categoria,p.estoque,p.estoqueMin,p.controlaVasilhame?p.cheios:'—',p.controlaVasilhame?p.vazios:'—',p.estoque<=p.estoqueMin?'BAIXO':'OK']);
    resumo=`${DB.produtos.length} produtos`;
  }else if(REL_TIPO==='topprod'){
    title='Produtos mais vendidos';const pv={};vendas.forEach(v=>v.itens.forEach(i=>{pv[i.nome]=pv[i.nome]||{q:0,t:0};pv[i.nome].q+=i.qtd;pv[i.nome].t+=i.qtd*i.unit;}));
    cols=['Produto','Qtd vendida','Faturamento'];rows=Object.entries(pv).sort((a,b)=>b[1].q-a[1].q).map(([n,d])=>[n,d.q,money(d.t)]);
    resumo='';
  }else if(REL_TIPO==='topcli'){
    title='Clientes que mais compraram';const cc={};vendas.forEach(v=>{cc[v.clienteId]=cc[v.clienteId]||{n:0,t:0};cc[v.clienteId].n++;cc[v.clienteId].t+=v.total;});
    cols=['Cliente','Compras','Total gasto'];rows=Object.entries(cc).sort((a,b)=>b[1].t-a[1].t).map(([id,d])=>[clienteById(id)?.nome||'Avulso',d.n,money(d.t)]);
    resumo='';
  }else if(REL_TIPO==='pagamentos'){
    title='Formas de pagamento';const fp={};vendas.forEach(v=>(v.pagamentos||[]).forEach(p=>fp[p.forma]=(fp[p.forma]||0)+p.valor));
    cols=['Forma','Valor','% do total'];const tot=Object.values(fp).reduce((a,b)=>a+b,0);
    rows=Object.entries(fp).sort((a,b)=>b[1]-a[1]).map(([f,v])=>[f,money(v),(tot?v/tot*100:0).toFixed(1)+'%']);
    resumo=`Total: ${money(tot)}`;
  }else if(REL_TIPO==='cancelamentos'){
    title='Cancelamentos (motivos de perda)';
    const cancel=DB.vendas.filter(v=>v.status==='Cancelado'&&inRange(v.data));
    const mot={};cancel.forEach(v=>{const m=v.motivoCancelamento||'Não informado';mot[m]=mot[m]||{n:0,val:0};mot[m].n++;mot[m].val+=v.total;});
    cols=['Motivo','Qtd','Valor perdido'];
    rows=Object.entries(mot).sort((a,b)=>b[1].n-a[1].n).map(([m,d])=>[m,d.n,money(d.val)]);
    resumo=`${cancel.length} cancelamento(s) · ${money(cancel.reduce((s,v)=>s+v.total,0))} em vendas perdidas`;
  }
  REL_DATA={cols,rows,title,resumo};
  $('#relOut').innerHTML=`<div class="card">
    <div class="pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><b style="font-size:15px">${title}</b><div style="font-size:12px;color:var(--muted)">${fmtDate(REL_INI)} a ${fmtDate(REL_FIM)}${resumo?' · '+resumo:''}</div></div></div>
    <div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
    ${rows.length?rows.map(r=>{const tot=/^TOTAIS?$/.test(String(r[0]));return`<tr${tot?' class="cx-tot"':''}>${r.map((c,i)=>`<td${i===0?' class="t-strong"':''}>${esc(c)}</td>`).join('')}</tr>`;}).join(''):`<tr><td colspan="${cols.length}"><div class="empty">${ic('chart')}<h4>Sem dados no período</h4></div></td></tr>`}
    </tbody></table></div></div>`;
}
function exportRel(fmt){
  const{cols,rows,title,resumo}=REL_DATA;
  if(fmt==='excel'){
    let csv='\uFEFF'+cols.join(';')+'\n'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title.replace(/\s+/g,'_')+'.csv';a.click();
    toast('Excel (CSV) exportado','ok');
  }else{
    const w=window.open('','_blank');
    w.document.write(`<html><head><title>${title}</title><style>body{font-family:Inter,Arial,sans-serif;padding:30px;color:#0f1a3a}h1{font-size:20px;margin:0 0 4px}.sub{color:#5b6b8c;font-size:12px;margin-bottom:18px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#12307f;color:#fff;text-align:left;padding:8px 10px}td{padding:7px 10px;border-bottom:1px solid #e3e8f2}tr:nth-child(even){background:#f6f8fd}.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}.hd b{color:#12307f;font-size:18px}.flame{color:#e01e26;font-size:26px}</style></head><body>
    <div class="hd"><span class="flame">🔥</span><b>${esc(DB.config.empresa)}</b></div>
    <h1>${title}</h1><div class="sub">Período: ${fmtDate(REL_INI)} a ${fmtDate(REL_FIM)}${resumo?' · '+resumo:''} · Emitido em ${new Date().toLocaleString('pt-BR')}</div>
    <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </body></html>`);
    w.document.close();setTimeout(()=>w.print(),400);
  }
}

/* ========== USUÁRIOS ========== */
RENDER.usuarios=function(){
  const desc={Administrador:'Acesso completo ao sistema',Atendente:'Cadastra clientes e registra vendas',Financeiro:'Vendas, fiado, contas e relatórios',Entregador:'Vê apenas as entregas atribuídas'};
  $('#content').innerHTML=`
   <div class="toolbar"><div style="flex:1"></div><button class="btn btn-primary btn-sm" onclick="formUsuario()">${ic('plus')} Novo usuário</button></div>
   <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Usuário</th><th>Login</th><th>Perfil</th><th>Permissões</th><th></th></tr></thead><tbody>
   ${DB.usuarios.map(u=>`<tr>
     <td><div style="display:flex;align-items:center;gap:10px"><div class="mini-ic" style="background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;font-weight:800;font-size:12px">${initials(u.nome)}</div><b>${esc(u.nome)}</b></div></td>
     <td><code style="background:#eef1f8;padding:2px 8px;border-radius:6px">${esc(u.login)}</code></td>
     <td><span class="tag ${u.papel==='Administrador'?'navy':u.papel==='Financeiro'?'green':u.papel==='Entregador'?'amber':'blue'}">${u.papel}</span></td>
     <td style="font-size:12px;color:var(--muted)">${desc[u.papel]}</td>
     <td><div class="pill-actions"><button onclick="formUsuario('${u.id}')" title="Editar">${ic('edit')}</button>${u.login!=='admin'?`<button class="danger" onclick="delUsuario('${u.id}')" title="Excluir">${ic('trash')}</button>`:''}</div></td>
   </tr>`).join('')}
   </tbody></table></div></div>`;
};
function formUsuario(id){
  const u=id?DB.usuarios.find(x=>x.id===id):{papel:'Atendente'};
  modal(id?'Editar usuário':'Novo usuário',`
   <div class="form-grid">
     <div class="field full"><label>Nome *</label><input id="u_nome" value="${esc(u.nome)}"></div>
     <div class="field"><label>Login *</label><input id="u_login" value="${esc(u.login)}"></div>
     <div class="field"><label>Senha *</label><input id="u_senha" value="${esc(u.senha)}"></div>
     <div class="field full"><label>Perfil de acesso</label><select id="u_papel">${['Administrador','Atendente','Financeiro','Entregador'].map(p=>`<option ${u.papel===p?'selected':''}>${p}</option>`).join('')}</select></div>
   </div>`,
   `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="saveUser">Salvar</button>`);
  $('#saveUser').onclick=()=>{
    const nome=$('#u_nome').value.trim(),login=$('#u_login').value.trim(),senha=$('#u_senha').value;
    if(!nome||!login||!senha){toast('Preencha todos os campos','err');return;}
    const data={nome,login,senha,papel:$('#u_papel').value};
    if(id){Object.assign(u,data);}else{DB.usuarios.push({id:uid(),...data});}
    save();closeModal();toast('Usuário salvo','ok');RENDER.usuarios();
  };
}
function delUsuario(id){confirmDel('Excluir este usuário?',()=>{DB.usuarios=DB.usuarios.filter(u=>u.id!==id);save();RENDER.usuarios();toast('Usuário excluído','ok');});}

/* ========== IMPRESSÃO TÉRMICA (CUPOM) ========== */
function printHTML(inner,titulo){
  const modo=(DB.config.larguraCupom==='58')?'58':'80';
  const page=modo==='58'?'58mm':'80mm';
  const largura=modo==='58'?'54mm':'76mm';
  const w=window.open('','_blank','width=400,height=680');
  if(!w){toast('Libere os pop-ups do navegador para imprimir','err');return;}
  const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${titulo}</title><style>
    @page{size:${page} auto;margin:2mm}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Courier New',ui-monospace,monospace;color:#000;background:#fff;font-size:12px;line-height:1.35}
    .cupom{width:${largura};margin:0 auto;padding:2mm 0}
    .c{text-align:center}.r{text-align:right}.b{font-weight:bold}.muted{font-size:11px}
    .lg{max-width:42mm;max-height:22mm;object-fit:contain;margin:0 auto 4px;display:block}
    .hr{border:none;border-top:1px dashed #000;margin:5px 0}
    .row{display:flex;justify-content:space-between;gap:6px}
    .row .nm,.nm{flex:1;word-break:break-word}
    h1{font-size:14px;text-align:center}.big{font-size:15px}
    table{width:100%;border-collapse:collapse}td{vertical-align:top;padding:1px 0}
    @media screen{body{background:#e9edf7;padding:18px}.cupom{background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.16);padding:6mm 4mm;border-radius:4px}}
    .noprint{text-align:center;margin:14px auto 0}
    .noprint button{font:inherit;padding:9px 18px;margin:0 4px;border:1px solid #12307f;border-radius:7px;background:#12307f;color:#fff;cursor:pointer;font-weight:bold}
    .noprint button.sec{background:#fff;color:#12307f}
    @media print{.noprint{display:none}body{background:#fff;padding:0}}
  </style></head><body><div class="cupom">${inner}</div>
  <div class="noprint"><button onclick="window.print()">Imprimir</button><button class="sec" onclick="window.close()">Fechar</button></div>
  <scr`+`ipt>window.onload=function(){setTimeout(function(){try{window.print();}catch(e){}},400);};<\/scr`+`ipt>
  </body></html>`;
  w.document.open();w.document.write(doc);w.document.close();
}

/* ========== LOGÍSTICA: GEO / ÁREAS / COBERTURA ========== */
function pointInPoly(lat,lng,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];const hit=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);if(hit)inside=!inside;}return inside;}
function areaDoPonto(lat,lng){if(lat==null||lng==null)return null;return (DB.areas||[]).find(a=>a.poligono&&a.poligono.length>=3&&pointInPoly(lat,lng,a.poligono))||null;}
function areaPorBairro(b){if(!b)return null;const s=b.trim().toLowerCase();return (DB.areas||[]).find(a=>(a.bairros||[]).some(x=>(x||'').trim().toLowerCase()===s))||null;}
function areaDoCliente(c){if(!c)return null;return (c.lat!=null&&c.lng!=null?areaDoPonto(c.lat,c.lng):null)||areaPorBairro(c.bairro);}
function coberturaCliente(c){const a=areaDoCliente(c);
  if(!a)return{k:'nao',area:null,cor:'#e01e26',bg:'#fdeaea',icon:'❌',label:'Ainda não entregamos neste endereço'};
  if(a.status==='nao')return{k:'nao',area:a,cor:'#e01e26',bg:'#fdeaea',icon:'❌',label:`${a.nome}: não atendemos`};
  if(a.status==='expansao')return{k:'exp',area:a,cor:'#e08a00',bg:'#fdf1de',icon:'⚠️',label:`${a.nome} — região em expansão · taxa ${money(a.taxa)}`};
  return{k:'ok',area:a,cor:'#12a150',bg:'#e6f6ed',icon:'✅',label:`Entregamos em ${a.nome} · taxa ${money(a.taxa)}${a.pedidoMin?` · mín ${money(a.pedidoMin)}`:''}`};
}
async function viaCep(cep){const c=(cep||'').replace(/\D/g,'');if(c.length!==8)return null;try{const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);const j=await r.json();if(j.erro)return null;return{endereco:j.logradouro||'',bairro:j.bairro||'',cidade:j.localidade||'',uf:j.uf||''};}catch(e){return null;}}
async function geocode(q){try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(q)}`,{headers:{Accept:'application/json'}});const j=await r.json();if(j&&j[0])return{lat:+j[0].lat,lng:+j[0].lon};}catch(e){}return null;}

/* ========== LOGÍSTICA: PEDIDO / ENTREGA HELPERS ========== */
function setStatusPedido(v,status){v.status=status;v.timeline=v.timeline||[];v.timeline.push({status,ts:today()+'T'+nowTime()});}
function tsOf(v,status){const t=(v.timeline||[]).find(x=>x.status===status);return t?t.ts:null;}
function minutosEntre(a,b){if(!a||!b)return null;const d=(new Date(b)-new Date(a))/60000;return isFinite(d)&&d>=0?d:null;}
function tempoMedioEntregaMin(vendas){const ds=[];vendas.forEach(v=>{const a=tsOf(v,'Pedido recebido')||((v.data||'')+'T'+(v.hora||'00:00'));const b=tsOf(v,'Entregue');const m=minutosEntre(a,b);if(m!=null&&m<1440)ds.push(m);});if(!ds.length)return null;return Math.round(ds.reduce((s,x)=>s+x,0)/ds.length);}
function entregasEmAndamento(){return DB.vendas.filter(v=>['Pedido recebido','Preparando','Saiu para entrega'].includes(v.status));}
function ultimaCompra(cliId){const vs=DB.vendas.filter(v=>v.clienteId===cliId&&v.status!=='Cancelado').map(v=>v.data).sort();return vs.length?vs[vs.length-1]:null;}
function diasSem(cliId){const u=ultimaCompra(cliId);return u==null?Infinity:daysBetween(u,today());}
function clientesAtivos(dias){return DB.clientes.filter(c=>diasSem(c.id)<=dias);}
function gasVendidoQtd(vendas){let q=0;vendas.forEach(v=>v.itens.forEach(i=>{if(grupoProduto(prodById(i.produtoId)||{nome:i.nome})==='Gás')q+=i.qtd;}));return q;}
function vendasDaArea(areaId,ini,fim){return DB.vendas.filter(v=>{if(v.status==='Cancelado')return false;if(ini&&v.data<ini)return false;if(fim&&v.data>fim)return false;const c=clienteById(v.clienteId);const a=c?areaDoCliente(c):null;return a&&a.id===areaId;});}
function entregadores(){return DB.usuarios.filter(u=>u.papel==='Entregador');}

/* ========== LOGÍSTICA: WHATSAPP ========== */
function trackingLink(v){if(!v||!v.token)return'';let base='https://seudeposito.com.br';try{if(location&&location.origin&&location.origin.indexOf('http')===0)base=location.origin+location.pathname;}catch(e){}return base+'#/acompanhar/'+v.token;}
function waTemplateRender(tpl,v){const c=clienteById(v.clienteId);return (tpl||'').replace(/{NOME}/g,c?.nome||'Cliente').replace(/{PEDIDO}/g,'#'+v.numero).replace(/{PRODUTOS}/g,v.itens.map(i=>i.qtd+'x '+i.nome).join(', ')).replace(/{QUANTIDADE}/g,v.itens.reduce((s,i)=>s+i.qtd,0)).replace(/{VALOR}/g,money(v.total).replace('R$','').trim()).replace(/{ENDERECO}/g,v.endereco||enderecoCompleto(c)||'').replace(/{LINK}/g,trackingLink(v)||'(link disponível ao iniciar a entrega)');}
function enviarWhats(id,statusKey){const v=DB.vendas.find(x=>x.id===id);if(!v)return;const c=clienteById(v.clienteId);if(!c||!c.whatsapp){toast('Cliente sem WhatsApp cadastrado','err');return;}const tpl=(DB.config.waTemplates||{})[statusKey||v.status]||'';window.open(waLink(c.whatsapp,waTemplateRender(tpl,v)),'_blank');}

/* ========== MAPA DE ENTREGAS ========== */
let MAP=null, MAP_TAB='operacao', DRAW_MODE=false, DRAW_PTS=[], DRAW_LAYER=null, COM_INI='', COM_FIM='';
RENDER.mapa=function(){
  const tabs=[['operacao','Operação'],['areas','Áreas'],['comercial','Comercial'],['calor','Mapa de calor'],['radar','Radar']];
  $('#content').innerHTML=`
   <div class="seg" style="margin-bottom:14px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="${MAP_TAB===k?'active':''}" onclick="mapTab('${k}')">${l}</button>`).join('')}</div>
   <div class="mapa-wrap"><div id="mapCanvas" class="mapa-canvas"></div><div id="mapPanel" class="mapa-panel"></div></div>`;
  initMapa();
};
function mapTab(k){MAP_TAB=k;DRAW_MODE=false;DRAW_PTS=[];RENDER.mapa();}
function initMapa(){
  const el=$('#mapCanvas');if(!el)return;
  if(!window.L){el.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted)">🌐 O mapa precisa de internet para carregar (OpenStreetMap). Verifique a conexão e recarregue.</div>';renderMapPanel();return;}
  if(MAP){try{MAP.remove();}catch(e){}MAP=null;}
  MAP=L.map(el).setView(DB.config.mapCenter,DB.config.mapZoom||12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',crossOrigin:true,attribution:'© OpenStreetMap, © CARTO'}).addTo(MAP);
  drawAreasLayer();
  if(MAP_TAB==='operacao')layerOperacao();
  else if(MAP_TAB==='calor')layerCalor();
  else if(MAP_TAB==='comercial'||MAP_TAB==='radar')layerClientes();
  else if(MAP_TAB==='areas')enableDraw();
  renderMapPanel();
  fixMapSize();
}
function fixMapSize(){
  const run=()=>{if(MAP){try{MAP.invalidateSize(true);}catch(e){}}};
  requestAnimationFrame(run);
  [120,350,700,1200].forEach(t=>setTimeout(run,t));
}
window.addEventListener('resize',()=>{if(MAP&&document.getElementById('mapCanvas')){try{MAP.invalidateSize(true);}catch(e){}}});
function drawAreasLayer(){(DB.areas||[]).forEach(a=>{if(!a.poligono||a.poligono.length<3)return;const op=a.status==='atende'?.18:.10;L.polygon(a.poligono,{color:a.cor,weight:2,fillColor:a.cor,fillOpacity:op,dashArray:a.status==='expansao'?'6 6':null}).addTo(MAP).bindPopup(`<b>${esc(a.nome)}</b><br>${a.status==='atende'?'Atendemos':a.status==='expansao'?'Em expansão':'Não atendemos'}<br>Taxa ${money(a.taxa)}${a.pedidoMin?' · mín '+money(a.pedidoMin):''}<br>~${a.tempoMedio} min`);});}
function clientLatLng(c){return (c.lat!=null&&c.lng!=null)?[c.lat,c.lng]:null;}
function layerClientes(){DB.clientes.forEach(c=>{const ll=clientLatLng(c);if(!ll)return;const cov=coberturaCliente(c);L.circleMarker(ll,{radius:6,color:'#fff',weight:2,fillColor:cov.k==='ok'?'#1e56d6':cov.k==='exp'?'#e08a00':'#e01e26',fillOpacity:.9}).addTo(MAP).bindPopup(`<b>${esc(c.nome)}</b><br>${esc(enderecoCompleto(c))}<br>${cov.icon} ${esc(cov.label)}`);});}
function layerOperacao(){
  layerClientes();
  entregasEmAndamento().forEach(v=>{const c=clienteById(v.clienteId);const ll=c&&clientLatLng(c);if(ll){const clr=v.status==='Saiu para entrega'?'#12307f':'#e08a00';L.marker(ll).addTo(MAP).bindPopup(`🛵 <b>Pedido #${v.numero}</b><br>${esc(c.nome)}<br>${esc(v.status)}<br>${v.entregador?'Entregador: '+esc(v.entregador):'Sem entregador'}`);}
    if(v.coordEntregador){L.circleMarker([v.coordEntregador.lat,v.coordEntregador.lng],{radius:9,color:'#fff',weight:3,fillColor:'#12a150',fillOpacity:1}).addTo(MAP).bindPopup(`🟢 ${esc(v.entregador||'Entregador')}<br>Pedido #${v.numero} · a caminho`);}
  });
}
function layerCalor(){const pts=[];DB.clientes.forEach(c=>{const ll=clientLatLng(c);if(!ll)return;const n=DB.vendas.filter(v=>v.clienteId===c.id&&v.status!=='Cancelado').length;if(n>0)pts.push([ll[0],ll[1],Math.min(1,n/6)]);});if(L.heatLayer&&pts.length)L.heatLayer(pts,{radius:35,blur:22,maxZoom:15}).addTo(MAP);}
/* ---- desenhar área ---- */
function enableDraw(){if(!MAP)return;MAP.on('click',onDrawClick);}
function onDrawClick(e){if(!DRAW_MODE)return;DRAW_PTS.push([e.latlng.lat,e.latlng.lng]);redrawTemp();}
function redrawTemp(){if(DRAW_LAYER){try{MAP.removeLayer(DRAW_LAYER);}catch(e){}}DRAW_LAYER=L.polygon(DRAW_PTS.length?DRAW_PTS:[[0,0]],{color:'#1e56d6',weight:2,dashArray:'5 5',fillOpacity:.12}).addTo(MAP);renderMapPanel();}
function startDraw(){DRAW_MODE=true;DRAW_PTS=[];toast('Clique no mapa para marcar os limites da área','ok');renderMapPanel();}
function undoDraw(){DRAW_PTS.pop();redrawTemp();}
function cancelDraw(){DRAW_MODE=false;DRAW_PTS=[];if(DRAW_LAYER){try{MAP.removeLayer(DRAW_LAYER);}catch(e){}DRAW_LAYER=null;}renderMapPanel();}
function saveDraw(){if(DRAW_PTS.length<3){toast('Marque ao menos 3 pontos','err');return;}formArea(null,DRAW_PTS.slice());DRAW_MODE=false;}

  }else if(MAP_TAB==='comercial'){
    if(!COM_INI){const x=new Date();x.setDate(x.getDate()-29);COM_INI=x.toISOString().slice(0,10);COM_FIM=today();}

let OL_CART={}, OL_CLIENT=null, OL_PAY='PIX';
function pedirLink(){let base='https://seudeposito.com.br';try{if(location&&location.origin&&location.origin.indexOf('http')===0)base=location.origin+location.pathname;}catch(e){}return base+'#/pedir';}

     <div style="font-weight:800;font-size:14px;margin:6px 0 10px">Escolha os produtos</div>
     ${prods.map(p=>{const q=OL_CART[p.id]||0;return`<div style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3e8f2;border-radius:12px;padding:12px;margin-bottom:8px">
